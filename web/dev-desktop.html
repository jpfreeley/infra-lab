<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dev Desktop — Self Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3250;--accent:#6c63ff;--accent2:#00d4aa;--danger:#ff4f6d;--text:#e2e8f0;--muted:#8892a4;--code:#12151f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{max-width:600px;width:100%}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px}
.logo p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;background:var(--code);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--muted)}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.status{display:none;margin-top:20px}
.status.show{display:block}
.countdown{text-align:center;margin-bottom:20px}
.countdown-time{font-size:36px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.countdown-label{font-size:12px;color:var(--muted);margin-top:4px}
.checklist{margin:16px 0}
.check-item{display:flex;align-items:center;padding:10px 14px;background:var(--code);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;transition:border-color .3s}
.check-item.ready{border-color:var(--accent2)}
.check-icon{width:24px;height:24px;margin-right:12px;display:flex;align-items:center;justify-content:center;font-size:16px}
.check-item .spinner-sm{width:16px;height:16px;border:2px solid #fff2;border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
.check-name{flex:1;font-size:13px;font-weight:500}
.check-url{font-size:12px;color:var(--accent2);text-decoration:none;font-family:ui-monospace,monospace}
.check-url:hover{text-decoration:underline}
.creds{margin-top:16px;padding:14px;background:var(--code);border:1px solid var(--border);border-radius:8px}
.creds h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.creds p{font-size:13px;margin-bottom:4px}
.creds code{color:var(--accent2);font-family:ui-monospace,monospace}
.error{margin-top:12px;padding:10px 14px;background:#ff4f6d11;border:1px solid #ff4f6d44;border-radius:8px;font-size:12px;color:var(--danger);display:none}
.error.show{display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
.all-ready{text-align:center;padding:12px;background:#00d4aa22;border:1px solid #00d4aa55;border-radius:8px;color:var(--accent2);font-weight:600;font-size:14px;margin-top:12px;display:none}
.all-ready.show{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>⚡ Dev Desktop</h1>
    <p>Self-service development environment</p>
  </div>

  <div class="card" id="form-card">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="e.g. alice" autocomplete="off"/>
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="apikey" placeholder="Enter your API key"/>
    </div>
    <button class="btn" id="launch-btn" onclick="launchDesktop()">
      Launch Desktop
    </button>
    <div class="error" id="error"></div>
  </div>

  <div class="status" id="status-card">
    <div class="card">
      <div class="countdown">
        <div class="countdown-time" id="countdown">5:00</div>
        <div class="countdown-label">Estimated time to ready</div>
      </div>

      <div class="checklist" id="checklist"></div>

      <div class="all-ready" id="all-ready">🎉 All services are up! Connect now.</div>

      <div class="creds" id="creds">
        <h4>Credentials</h4>
        <p>DCV User: <code>dcvuser</code></p>
        <p>DCV Password: <code>ChangeMeOnFirstLogin!</code></p>
        <p>code-server: <code>no password (IP-restricted)</code></p>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://i50blnf638.execute-api.us-east-1.amazonaws.com/v1/desktops';

const SERVICES = [
  { id: 'dcv', name: '🖥️ Desktop (DCV)', port: 8443, protocol: 'https', checkable: false },
  { id: 'backend', name: '⚙️ Backend API', port: 5000, protocol: 'http', checkable: true, path: '/health' },
  { id: 'frontend', name: '🌐 Frontend', port: 5173, protocol: 'http', checkable: true },
  { id: 'code_server', name: '📝 VS Code', port: 8080, protocol: 'http', checkable: true },
  { id: 'supabase_studio', name: '🗄️ Supabase Studio', port: 54323, protocol: 'http', checkable: true },
  { id: 'supabase_api', name: '🔌 Supabase API', port: 54321, protocol: 'http', checkable: true, path: '/rest/v1/' },
  { id: 'ollama', name: '🧠 Ollama AI', port: 0, protocol: '', checkable: false },
];

let publicIp = null;
let countdownInterval = null;
let pollInterval = null;
let countdownSeconds = 300;
let serviceStatus = {};

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

function buildChecklist(ip) {
  const container = document.getElementById('checklist');
  container.innerHTML = '';
  SERVICES.forEach(svc => {
    const url = svc.port ? `${svc.protocol}://${ip}:${svc.port}` : '';
    serviceStatus[svc.id] = false;
    const div = document.createElement('div');
    div.className = 'check-item';
    div.id = `check-${svc.id}`;
    div.innerHTML = `
      <div class="check-icon"><div class="spinner-sm"></div></div>
      <span class="check-name">${svc.name}</span>
      ${url ? `<a class="check-url" href="${url}" target="_blank" style="opacity:0.4">${ip}:${svc.port}</a>` : '<span class="check-url" style="opacity:0.4">internal</span>'}
    `;
    container.appendChild(div);
  });
}

function markReady(svcId) {
  if (serviceStatus[svcId]) return;
  serviceStatus[svcId] = true;
  const el = document.getElementById(`check-${svcId}`);
  if (el) {
    el.classList.add('ready');
    el.querySelector('.check-icon').innerHTML = '✅';
    el.querySelector('.check-url').style.opacity = '1';
  }
  // Check if all done
  if (Object.values(serviceStatus).every(v => v)) {
    document.getElementById('all-ready').classList.add('show');
    document.getElementById('countdown').textContent = '0:00';
    clearInterval(countdownInterval);
    clearInterval(pollInterval);
  }
}

function startCountdown() {
  countdownSeconds = 600;
  updateCountdownDisplay();
  countdownInterval = setInterval(() => {
    countdownSeconds--;
    if (countdownSeconds <= 0) {
      countdownSeconds = 0;
      clearInterval(countdownInterval);
    }
    updateCountdownDisplay();
  }, 1000);
}

function updateCountdownDisplay() {
  const min = Math.floor(countdownSeconds / 60);
  const sec = countdownSeconds % 60;
  document.getElementById('countdown').textContent = `${min}:${sec.toString().padStart(2, '0')}`;
}

async function checkService(svc) {
  if (serviceStatus[svc.id]) return;
  const url = `${svc.protocol}://${publicIp}:${svc.port}${svc.path || '/'}`;
  try {
    const controller = new AbortController();
    setTimeout(() => controller.abort(), 3000);
    const res = await fetch(url, { mode: 'no-cors', signal: controller.signal });
    // no-cors means we can't read the response, but if fetch doesn't throw, the server responded
    markReady(svc.id);
  } catch (e) {
    // Not ready yet
  }
}

function startPolling() {
  // DCV uses HTTPS with self-signed cert — mark it ready after 3 min (can't check from browser)
  setTimeout(() => markReady('dcv'), 180000);

  pollInterval = setInterval(() => {
    SERVICES.filter(s => s.checkable).forEach(svc => checkService(svc));
  }, 10000);

  // Also do an immediate check
  setTimeout(() => {
    SERVICES.filter(s => s.checkable).forEach(svc => checkService(svc));
  }, 30000);
}

async function launchDesktop() {
  const username = document.getElementById('username').value.trim();
  const apikey = document.getElementById('apikey').value.trim();
  if (!username) { showError('Username is required'); return; }
  if (!apikey) { showError('API Key is required'); return; }

  const btn = document.getElementById('launch-btn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Launching...';

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apikey },
      body: JSON.stringify({ username })
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || `Error ${res.status}`);
      btn.disabled = false;
      btn.textContent = 'Launch Desktop';
      return;
    }

    publicIp = data.public_ip;
    if (!publicIp) {
      showError('No IP returned. Try again in 30 seconds.');
      btn.disabled = false;
      btn.textContent = 'Launch Desktop';
      return;
    }

    // Show status card
    document.getElementById('form-card').style.display = 'none';
    document.getElementById('status-card').classList.add('show');

    // Build checklist and start monitoring
    buildChecklist(publicIp);
    startCountdown();
    startPolling();

    // Handle Ollama status from API response
    if (data.ollama) {
      if (data.ollama.status === 'running') {
        markReady('ollama');
      } else if (data.ollama.status === 'starting') {
        // Will be marked ready after a delay
        setTimeout(() => markReady('ollama'), 120000);
      }
    }

    // If instance was already running AND status says so, shorter countdown
    if (data.status === 'running' && data.note === undefined) {
      countdownSeconds = 60;
      updateCountdownDisplay();
      SERVICES.filter(s => s.checkable).forEach(svc => checkService(svc));
    }

  } catch (e) {
    showError('Network error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Launch Desktop';
  }
}

document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') launchDesktop(); });
document.getElementById('apikey').addEventListener('keypress', e => { if (e.key === 'Enter') launchDesktop(); });
</script>
</body>
</html>
