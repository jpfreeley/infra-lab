<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Dev Desktop — Self Service</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f1117;--surface:#1a1d27;--surface2:#22263a;--border:#2e3250;--accent:#6c63ff;--accent2:#00d4aa;--danger:#ff4f6d;--text:#e2e8f0;--muted:#8892a4;--code:#12151f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.container{max-width:560px;width:100%}
.logo{text-align:center;margin-bottom:32px}
.logo h1{font-size:24px;font-weight:700;color:#fff;letter-spacing:-.5px}
.logo p{color:var(--muted);font-size:13px;margin-top:4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;background:var(--code);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;font-family:inherit;outline:none;transition:border .2s}
.field input:focus{border-color:var(--accent)}
.field input::placeholder{color:var(--muted)}
.btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.stop{background:var(--danger)}
.status{display:none;margin-top:20px}
.status.show{display:block}
.status-badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.status-badge.provisioning{background:#6c63ff33;color:var(--accent)}
.status-badge.starting{background:#f7d15433;color:#f7d154}
.status-badge.running{background:#00d4aa33;color:var(--accent2)}
.status-badge.stopped{background:#ff4f6d33;color:var(--danger)}
.endpoints{margin-top:16px}
.endpoint{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--code);border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.endpoint-name{font-size:12px;color:var(--muted);font-weight:500}
.endpoint-url{font-size:13px;color:var(--accent2);text-decoration:none;font-family:ui-monospace,monospace}
.endpoint-url:hover{text-decoration:underline}
.creds{margin-top:16px;padding:14px;background:var(--code);border:1px solid var(--border);border-radius:8px}
.creds h4{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px}
.creds p{font-size:13px;margin-bottom:4px}
.creds code{color:var(--accent2);font-family:ui-monospace,monospace}
.note{margin-top:12px;padding:10px 14px;background:#6c63ff11;border:1px solid #6c63ff44;border-radius:8px;font-size:12px;color:var(--muted)}
.error{margin-top:12px;padding:10px 14px;background:#ff4f6d11;border:1px solid #ff4f6d44;border-radius:8px;font-size:12px;color:var(--danger);display:none}
.error.show{display:block}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #fff3;border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;margin-right:8px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.actions{display:flex;gap:8px;margin-top:12px}
.actions .btn{flex:1}
</style>
</head>
<body>
<div class="container">
  <div class="logo">
    <h1>⚡ Dev Desktop</h1>
    <p>Self-service development environment</p>
  </div>

  <div class="card" id="form-card">
    <div class="field">
      <label>Username</label>
      <input type="text" id="username" placeholder="e.g. alice" autocomplete="off"/>
    </div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="apikey" placeholder="Enter your API key"/>
    </div>
    <button class="btn" id="launch-btn" onclick="launchDesktop()">
      Launch Desktop
    </button>
    <button class="btn" id="check-btn" onclick="checkStatus()" style="margin-top:8px;background:var(--surface2);border:1px solid var(--border)">
      Check Status
    </button>
    <div class="error" id="error"></div>
  </div>

  <div class="status" id="status-card">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div>
          <h3 style="font-size:16px;color:#fff" id="status-username">—</h3>
          <p style="font-size:12px;color:var(--muted)" id="status-instance">—</p>
        </div>
        <span class="status-badge" id="status-badge">—</span>
      </div>

      <div class="endpoints" id="endpoints"></div>

      <div class="creds" id="creds" style="display:none">
        <h4>Credentials</h4>
        <p>DCV User: <code id="cred-user">—</code></p>
        <p>DCV Password: <code id="cred-pass">—</code></p>
        <p>code-server: <code id="cred-code">—</code></p>
      </div>

      <div class="note" id="note" style="display:none"></div>

      <div class="actions">
        <button class="btn" onclick="checkStatus()">Refresh</button>
      </div>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://i50blnf638.execute-api.us-east-1.amazonaws.com/v1/desktops';

function showError(msg) {
  const el = document.getElementById('error');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

function setLoading(btn, loading) {
  btn.disabled = loading;
  if (loading) {
    btn.dataset.originalText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>Working...';
  } else {
    btn.textContent = btn.dataset.originalText || 'Launch Desktop';
  }
}

function renderStatus(data) {
  document.getElementById('status-card').classList.add('show');
  document.getElementById('status-username').textContent = data.username || '—';
  document.getElementById('status-instance').textContent = data.instance_id || '—';

  const badge = document.getElementById('status-badge');
  const status = data.status || 'unknown';
  badge.textContent = status;
  badge.className = 'status-badge ' + status;

  // Endpoints
  const container = document.getElementById('endpoints');
  container.innerHTML = '';
  if (data.endpoints) {
    const names = {
      dcv_desktop: '🖥️ Desktop (DCV)',
      code_server: '📝 VS Code',
      frontend: '🌐 Frontend',
      backend: '⚙️ Backend',
      supabase_studio: '🗄️ Supabase Studio',
      supabase_api: '🔌 Supabase API'
    };
    for (const [key, url] of Object.entries(data.endpoints)) {
      const div = document.createElement('div');
      div.className = 'endpoint';
      div.innerHTML = `
        <span class="endpoint-name">${names[key] || key}</span>
        <a class="endpoint-url" href="${url}" target="_blank">${url.replace(/https?:\/\//, '')}</a>
      `;
      container.appendChild(div);
    }
  }

  // Credentials
  const credsEl = document.getElementById('creds');
  if (data.credentials) {
    credsEl.style.display = 'block';
    document.getElementById('cred-user').textContent = data.credentials.dcv_user || '—';
    document.getElementById('cred-pass').textContent = data.credentials.dcv_password || '(set by user)';
    document.getElementById('cred-code').textContent = data.credentials.code_server_password || '—';
  } else {
    credsEl.style.display = 'none';
  }

  // Note
  const noteEl = document.getElementById('note');
  if (data.note) {
    noteEl.style.display = 'block';
    noteEl.textContent = data.note;
  } else {
    noteEl.style.display = 'none';
  }
}

async function launchDesktop() {
  const username = document.getElementById('username').value.trim();
  const apikey = document.getElementById('apikey').value.trim();

  if (!username) { showError('Username is required'); return; }
  if (!apikey) { showError('API Key is required'); return; }

  const btn = document.getElementById('launch-btn');
  setLoading(btn, true);

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Key': apikey },
      body: JSON.stringify({ username })
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || `Error ${res.status}`);
      return;
    }

    renderStatus(data);
  } catch (e) {
    showError('Network error: ' + e.message);
  } finally {
    setLoading(btn, false);
  }
}

async function checkStatus() {
  const username = document.getElementById('username').value.trim();
  const apikey = document.getElementById('apikey').value.trim();

  if (!username) { showError('Username is required'); return; }
  if (!apikey) { showError('API Key is required'); return; }

  const btn = document.getElementById('check-btn');
  setLoading(btn, true);

  try {
    const res = await fetch(`${API_URL}?username=${encodeURIComponent(username)}`, {
      headers: { 'X-API-Key': apikey }
    });
    const data = await res.json();

    if (!res.ok) {
      showError(data.error || `Error ${res.status}`);
      return;
    }

    renderStatus(data);
  } catch (e) {
    showError('Network error: ' + e.message);
  } finally {
    setLoading(btn, false);
  }
}

// Enter key triggers launch
document.getElementById('username').addEventListener('keypress', e => { if (e.key === 'Enter') launchDesktop(); });
document.getElementById('apikey').addEventListener('keypress', e => { if (e.key === 'Enter') launchDesktop(); });
</script>
</body>
</html>
