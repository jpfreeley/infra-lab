name: "Terraform CI"

on:
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.tf'
      - '.github/workflows/terraform-ci.yml'
  push:
    branches: [ main ]
    paths:
      - '**/*.tf'

# Explicitly set minimal permissions for the GITHUB_TOKEN
permissions:
  contents: read
  pull-requests: read

jobs:
  terraform:
    name: "Terraform Quality Checks"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive infra/

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        # tflint --init downloads the AWS ruleset through the GitHub API.
        # Unauthenticated, that shares the runner IP's 60 requests/hour and
        # failed with "403 API rate limit exceeded" on 2026-11-19 (main at
        # c57d76e, and PR #166). tflint uses GITHUB_TOKEN when set; the
        # job's token is read-only (permissions: contents: read above).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: tflint --init

      - name: Run TFLint
        run: |
          cd infra
          tflint -f compact

      - name: Run  Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          quiet: true
          framework: terraform
          output_format: cli
