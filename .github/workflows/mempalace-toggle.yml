name: MemPalace Server Toggle

# Manual up/down control for the mempalace server's billable resources
# (ALB, WAF, both ECS services). Everything else (VPC, EFS, KMS key,
# Secrets Manager secrets, ECS cluster, IAM roles, task definitions) costs
# close to nothing and is never touched here, up or down.
#
# The ALB, WAF, and listener are shared infrastructure as of the MagNet
# Legal instance (docs/adr/034-shared-mempalace-server.md, "MagNet Legal
# Instance") — this toggle is all-or-nothing for both instances together,
# deliberately, not per-instance. It's mempalace-idle-teardown.yml's job
# to decide *when* "down" is warranted (both instances idle, not just
# one); this workflow just executes whichever action it's told.
#
# Start of the nightly-teardown plan from ADR-034 ("Decided, Not Yet
# Built"): this is the manual trigger first, a schedule comes later once
# this is proven out.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Spin the mempalace server up or tear it down"
        required: true
        type: choice
        options:
          - up
          - down
  # Lets mempalace-idle-teardown.yml call this workflow directly instead of
  # duplicating the destroy target list — one place the resource list lives,
  # whether triggered by a human or by the idle checker. workflow_call
  # inputs can't use type: choice (only boolean/number/string), so this is
  # a separate input block from workflow_dispatch's above; `inputs.action`
  # resolves correctly either way depending on which trigger fired.
  workflow_call:
    inputs:
      action:
        description: "Spin the mempalace server up or tear it down"
        required: true
        type: string

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: mempalace-toggle
  cancel-in-progress: false

env:
  TF_VAR_aws_profile: "" # no named profile in CI, falls back to OIDC creds

jobs:
  toggle:
    name: "${{ inputs.action == 'up' && 'Spin Up' || 'Tear Down' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/live/mempalace
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::551452024305:role/infra-lab-github-actions-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Spin Up
        if: inputs.action == 'up'
        run: terraform apply -auto-approve

      - name: Tear Down
        if: inputs.action == 'down'
        # Targeted, deliberately: this destroys only the resources that
        # cost real standing money. VPC/EFS/KMS/Secrets/cluster/IAM stay.
        # Both ECS services are included: destroying their target groups
        # forces their replacement anyway (Terraform can't leave a service
        # pointing at a target group that won't exist), so they're listed
        # explicitly rather than relying on that cascade to do it
        # implicitly — same reasoning extended to the MagNet Legal
        # instance's listener rule and cert attachment below, both of
        # which reference aws_lb_listener.https and would get swept in via
        # dependency-order destroy anyway, but explicit beats implicit here.
        #
        # ACM certs (both) are deliberately NOT targeted — same as the
        # original personal-instance cert, they're cheap, don't depend on
        # the ALB existing, and re-validating DNS on every up/down cycle
        # would be pure friction for zero benefit.
        #
        # Tested end-to-end 2026-08-14 (personal instance only, before the
        # MagNet Legal instance existed), not just written and assumed:
        # destroying aws_lb.mempalace also pulls in the Route53 alias
        # record automatically (Terraform won't leave it referencing a
        # destroyed ALB's live attributes), confirmed via `terraform plan`
        # showing all 8 resources (7 targeted + the DNS record) correctly
        # back to "to add" afterward, and directly via AWS CLI
        # (ecs list-tasks / elbv2 describe-load-balancers / wafv2
        # list-web-acls all empty). Nothing is left dangling. The same
        # cascade should cover magnetlegal's own Route53 alias record once
        # the second instance exists — re-verify this specific claim live
        # the first time this runs with both instances deployed, don't
        # just assume the pattern holds.
        run: |
          terraform destroy -auto-approve \
            -target=aws_wafv2_web_acl_association.mempalace \
            -target=aws_wafv2_web_acl.mempalace \
            -target=aws_lb_listener_rule.magnetlegal \
            -target=aws_lb_listener_certificate.magnetlegal \
            -target=aws_lb_listener.https \
            -target=aws_lb_listener.http \
            -target=aws_lb_target_group.mempalace \
            -target=aws_lb_target_group.magnetlegal \
            -target=aws_lb.mempalace \
            -target=module.mempalace.aws_ecs_service.this \
            -target=module.mempalace_magnetlegal.aws_ecs_service.this

      - name: Show current outputs
        if: always()
        run: terraform output || true
