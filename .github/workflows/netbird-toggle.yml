name: NetBird Server Toggle

# Up/down control for the NetBird server's billable resources (ADR-037):
# the NLB, its HTTPS listener and target group, the Route53 alias, and the
# ECS service. Everything else (VPC, EFS, KMS key, Secrets Manager secrets,
# ACM certificate, ECS cluster, IAM roles, task definition) costs close to
# nothing and is never touched here, up or down. EFS holds all NetBird
# state, so peers keep their identity and IPs across a down/up cycle.
#
# Usually not run by hand. netbird-lease-teardown.yml calls it with
# action=down when the uptime lease expires, and with action=up when a lease
# is active but the stack is down. The local wrapper (netbird.sh) sets the
# lease and dispatches action=up directly.
#
# The target list below is the one in infra/live/netbird/nlb.tf's header.
# The UDP STUN listener and target group are not listed: they only exist
# when embedded STUN is enabled (stun_servers = []), which the live stack
# does not use (ADR-037 spike: STUN via NLB UDP gets no reply).

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Bring the NetBird server up or tear it down"
        required: true
        type: choice
        options:
          - up
          - down
  workflow_call:
    inputs:
      action:
        description: "Bring the NetBird server up or tear it down"
        required: true
        type: string

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: netbird-toggle
  cancel-in-progress: false

env:
  TF_VAR_aws_profile: "" # no named profile in CI, falls back to OIDC creds

jobs:
  toggle:
    name: "${{ inputs.action == 'up' && 'Spin Up' || 'Tear Down' }}"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/live/netbird
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::551452024305:role/infra-lab-github-actions-deploy
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init

      - name: Spin Up
        if: inputs.action == 'up'
        run: |
          terraform apply -auto-approve \
            -target=aws_lb.netbird \
            -target=aws_lb_target_group.https \
            -target=aws_lb_listener.https \
            -target=aws_route53_record.netbird \
            -target=module.netbird.aws_ecs_service.this

      - name: Wait for readiness
        if: inputs.action == 'up'
        # Same probe the upstream installer waits on. A cold start (NLB
        # provisioning, task launch, target registration) took about 2.5 to
        # 6 minutes in the spike; allow 15.
        run: |
          URL="https://netbird.lintwiselabs.com/oauth2/.well-known/openid-configuration"
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Ready after about $((i * 15)) seconds."
              exit 0
            fi
            sleep 15
          done
          echo "::error::Not ready after 15 minutes (last HTTP $code)."
          exit 1

      - name: Tear Down
        if: inputs.action == 'down'
        # Destroying the target group also destroys the ECS service that
        # references it, and destroying the NLB also destroys the Route53
        # alias that reads its attributes; both are listed explicitly anyway.
        # The task definition is not pulled in (verified with a destroy plan
        # on 2026-11-19), so the next "up" reuses the same revision.
        run: |
          terraform destroy -auto-approve \
            -target=module.netbird.aws_ecs_service.this \
            -target=aws_route53_record.netbird \
            -target=aws_lb_listener.https \
            -target=aws_lb_target_group.https \
            -target=aws_lb.netbird
