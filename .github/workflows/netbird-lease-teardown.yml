name: NetBird Lease Teardown

# Keeps the NetBird server (ADR-037) up only while an uptime lease is
# active. The lease is two repo variables, plain ISO 8601 UTC timestamps:
#
#   NETBIRD_KEEP_UP_FROM   (optional; empty means "from now")
#   NETBIRD_KEEP_UP_UNTIL
#
# set by the local wrapper (netbird.sh up <duration>) or by hand:
#   gh variable set NETBIRD_KEEP_UP_UNTIL --repo jpfreeley/infra-lab --body 2026-11-20T03:00:00Z
#
# Daily check-ins (ADR-038) can also keep the stack up. They are one repo
# variable, a list of local times and an IANA zone, for example:
#
#   NETBIRD_CHECKINS = "06:00,12:00,18:00,00:00 America/New_York"
#
# Each check-in opens a window from CHECKIN_BEFORE_MINUTES (40) before the
# time to CHECKIN_AFTER_MINUTES (15) after it. 40 minutes covers up to 15
# minutes of trigger delay (this workflow runs every 15 minutes), the cold
# start (about 6.5 minutes) and the clients' reconnect backoff, so the
# tablets are back before the monitor's report at the stated time. Times
# are evaluated with zoneinfo, so daylight saving time follows the local
# clock. Empty, unset or malformed means no check-ins (ADR-037 behavior,
# unchanged); a malformed value is reported as a warning annotation, never
# an error.
#
# "Wanted up" = lease active OR a check-in window open. Every run:
#   NLB present, wanted up           -> stay up
#   NLB present, not wanted up       -> tear down (via netbird-toggle.yml),
#                                       except a lease-less NLB younger than
#                                       60 minutes, so a manual
#                                       `terraform apply` isn't destroyed
#                                       out from under whoever ran it
#   NLB absent,  wanted up           -> bring up (self-healing, same idea as
#                                       the MemPalace protected-uptime window)
#   NLB absent,  not wanted up       -> nothing to do
#
# Why a lease and not traffic (ADR-037): every enrolled peer holds a
# long-lived management stream open, so the server never looks idle, and
# the remote-control traffic itself is peer to peer and never touches the
# server.
#
# Triggers (ADR-037): EventBridge Scheduler every 15 minutes is the primary
# clock (infra/live/dev/netbird_lease_teardown_trigger.tf dispatches this
# workflow through the GitHub API). GitHub's own cron below is the
# fallback: it is best effort (gaps of hours measured in ADR-034), but it
# does not depend on the GitHub token the Lambda uses, so an expired or
# revoked token still gets a late teardown instead of none. A run that
# finds nothing to do is harmless, so overlapping triggers are fine.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}

permissions:
  id-token: write # required for OIDC
  contents: read

concurrency:
  group: netbird-lease-check
  cancel-in-progress: false

jobs:
  check-lease:
    name: Check lease
    runs-on: ubuntu-latest
    outputs:
      should-teardown: ${{ steps.check.outputs.should_teardown }}
      should-bringup: ${{ steps.check.outputs.should_bringup }}
    steps:
      # Direct STS calls instead of aws-actions/configure-aws-credentials,
      # same reason as mempalace-idle-teardown.yml: a frequently scheduled
      # workflow that downloads the action from codeload on every run was
      # intermittently 429'd, skipping checks entirely.
      - name: Configure AWS credentials (management account)
        run: |
          ID_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')

          CREDS=$(aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::551452024305:role/infra-lab-github-actions-deploy \
            --role-session-name gha-netbird-lease-check \
            --web-identity-token "$ID_TOKEN" \
            --region us-east-1 \
            --query 'Credentials' --output json)

          AKID=$(echo "$CREDS" | jq -r .AccessKeyId)
          SECRET=$(echo "$CREDS" | jq -r .SecretAccessKey)
          TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
          echo "::add-mask::$AKID"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$AKID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_SESSION_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      # Second hop into the NetBird account, mirroring the assume_role in
      # infra/live/netbird/providers.tf. Without it the NLB lookup would run
      # in the management account and always find nothing (the exact bug
      # mempalace-idle-teardown.yml hit on 2026-08-15).
      - name: Configure AWS credentials (NetBird account)
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn arn:aws:iam::300077301490:role/OrganizationAccountAccessRole \
            --role-session-name gha-netbird-lease-chain \
            --region us-east-1 \
            --query 'Credentials' --output json)

          AKID=$(echo "$CREDS" | jq -r .AccessKeyId)
          SECRET=$(echo "$CREDS" | jq -r .SecretAccessKey)
          TOKEN=$(echo "$CREDS" | jq -r .SessionToken)
          echo "::add-mask::$AKID"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$AKID"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_SESSION_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

      - name: Compare the lease with the stack
        id: check
        env:
          KEEP_UP_FROM: ${{ vars.NETBIRD_KEEP_UP_FROM }}
          KEEP_UP_UNTIL: ${{ vars.NETBIRD_KEEP_UP_UNTIL }}
          CHECKINS: ${{ vars.NETBIRD_CHECKINS }}
          CHECKIN_BEFORE_MINUTES: "40"
          CHECKIN_AFTER_MINUTES: "15"
        run: |
          NOW_S=$(date -u +%s)

          # Lease state. A malformed timestamp counts as unset, never as an
          # error, so a typo can't wedge the stack up or down.
          LEASE=none
          UNTIL_S=""
          if [ -n "$KEEP_UP_UNTIL" ]; then
            UNTIL_S=$(date -u -d "$KEEP_UP_UNTIL" +%s 2>/dev/null || echo "")
          fi
          FROM_S=0
          if [ -n "$KEEP_UP_FROM" ]; then
            FROM_S=$(date -u -d "$KEEP_UP_FROM" +%s 2>/dev/null || echo 0)
          fi
          if [ -n "$UNTIL_S" ]; then
            if [ "$NOW_S" -ge "$FROM_S" ] && [ "$NOW_S" -lt "$UNTIL_S" ]; then
              LEASE=active
            else
              LEASE=expired
            fi
          fi
          echo "Lease: $LEASE (from='${KEEP_UP_FROM:-}', until='${KEEP_UP_UNTIL:-}')"

          # Check-in windows (ADR-038): prints open, closed, off or invalid.
          WINDOW=$(python3 - <<'PY'
          import datetime, os, re, zoneinfo
          spec = os.environ.get("CHECKINS", "").strip()
          if not spec:
              print("off"); raise SystemExit
          m = re.fullmatch(r"(\d{1,2}:\d{2}(?:\s*,\s*\d{1,2}:\d{2})*)\s+(\S+)", spec)
          try:
              tz = zoneinfo.ZoneInfo(m.group(2))
              times = []
              for t in m.group(1).split(","):
                  h, mi = (int(x) for x in t.strip().split(":"))
                  assert 0 <= h <= 23 and 0 <= mi <= 59
                  times.append(h * 60 + mi)
          except Exception:
              print("invalid"); raise SystemExit
          before = int(os.environ["CHECKIN_BEFORE_MINUTES"])
          after = int(os.environ["CHECKIN_AFTER_MINUTES"])
          now = datetime.datetime.now(tz)
          minute = now.hour * 60 + now.minute
          # Minutes since each window opened, modulo a day, so a window that
          # crosses midnight (the 00:00 check-in) needs no special case.
          inside = any((minute - (t - before)) % 1440 < before + after for t in times)
          print("open" if inside else "closed")
          PY
          )
          if [ "$WINDOW" = "invalid" ]; then
            echo "::warning::NETBIRD_CHECKINS='$CHECKINS' is not 'HH:MM[,HH:MM...] <IANA zone>'; ignoring it."
          fi
          echo "Check-in window: $WINDOW (check-ins='${CHECKINS:-}', -${CHECKIN_BEFORE_MINUTES}/+${CHECKIN_AFTER_MINUTES} min)"

          WANTED=false
          if [ "$LEASE" = "active" ] || [ "$WINDOW" = "open" ]; then
            WANTED=true
          fi

          NLB_CREATED=$(aws elbv2 describe-load-balancers \
            --names infra-lab-netbird-nlb \
            --region us-east-1 \
            --query 'LoadBalancers[0].CreatedTime' \
            --output text 2>/dev/null || echo "None")

          if [ "$NLB_CREATED" = "None" ] || [ -z "$NLB_CREATED" ]; then
            echo "should_teardown=false" >> "$GITHUB_OUTPUT"
            if [ "$WANTED" = "true" ]; then
              echo "NLB absent but the stack is wanted up (lease $LEASE, window $WINDOW): bringing it up."
              echo "should_bringup=true" >> "$GITHUB_OUTPUT"
            else
              echo "NLB absent and not wanted up: already down, nothing to do."
              echo "should_bringup=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          echo "should_bringup=false" >> "$GITHUB_OUTPUT"

          if [ "$WANTED" = "true" ]; then
            echo "Wanted up (lease $LEASE, window $WINDOW): staying up."
            echo "should_teardown=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$LEASE" = "none" ]; then
            AGE_S=$(( NOW_S - $(date -u -d "$NLB_CREATED" +%s) ))
            if [ "$AGE_S" -lt 3600 ]; then
              echo "No lease, but the NLB is only ${AGE_S}s old (manual apply?): staying up for now."
              echo "should_teardown=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          echo "NLB present, lease $LEASE, window $WINDOW: tearing down."
          echo "should_teardown=true" >> "$GITHUB_OUTPUT"

  teardown:
    name: Tear down (lease over)
    needs: check-lease
    if: needs.check-lease.outputs.should-teardown == 'true'
    uses: ./.github/workflows/netbird-toggle.yml
    with:
      action: down
    permissions:
      id-token: write
      contents: read

  bring-up:
    name: Bring up (lease active or check-in window open)
    needs: check-lease
    if: needs.check-lease.outputs.should-bringup == 'true'
    uses: ./.github/workflows/netbird-toggle.yml
    with:
      action: up
    permissions:
      id-token: write
      contents: read
