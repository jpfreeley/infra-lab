<text x="30" y="728" font-size="12" fill="#5f6b7a" font-weight="700" text-anchor="start">DESIGN PRINCIPLES</text>
<text x="30" y="750" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• No IAM users or access keys (SCP)</text>
<text x="30" y="767" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• Guardrails by OU, service boundary</text>
<text x="39" y="784" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">SCPs on single-purpose accounts</text>
<text x="30" y="801" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• Compute off by default in dev</text>
<text x="39" y="818" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">(ADR-030); workers scale from 0</text>
<text x="30" y="835" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• Execution plane cannot reach the</text>

<text x="30" y="869" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• Encryption with customer KMS keys</text>
<text x="30" y="886" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• TLS-only S3 bucket policies</text>
<text x="30" y="903" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• Tag-based cost allocation, budgets,</text>
<text x="39" y="920" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">anomaly alerts and backups</text>
<text x="30" y="937" font-size="11.5" fill="#1f2933" font-weight="400" text-anchor="start">• Every decision recorded as an ADR</text>
