directory:
  - .
quiet: true
soft-fail: false
framework:
  - terraform
output:
  - cli
  - junitxml
download-external-modules: true
evaluate-variables: true
skip-check:
  - CKV2_AWS_28  # WAF association for ALB - deferred to prod (E09/E10)
  - CKV2_AWS_8   # AWS Backup plan for RDS - deferred to prod (E12)
  - CKV2_AWS_34  # SSM Parameter encryption - non-sensitive control flags don't need SecureString
  - CKV2_AWS_51  # API GW client certificate - internal dev tool, not public-facing
  - CKV2_AWS_4   # API GW stage logging - internal dev tool, CloudWatch costs unnecessary
  - CKV2_AWS_53  # API GW request validation - internal dev tool
  - CKV2_AWS_29  # API GW WAF - internal dev tool
  - CKV_AWS_28   # DynamoDB PITR - dev tracking table, ephemeral data
  - CKV_AWS_119  # DynamoDB CMK encryption - dev table, AWS-managed encryption sufficient
  - CKV_AWS_116  # Lambda DLQ - provisioner is synchronous, no async processing
  - CKV_AWS_50   # Lambda X-Ray - internal dev tool
  - CKV_AWS_173  # Lambda env var encryption - secrets fetched at runtime, not stored in env
  - CKV_AWS_272  # Lambda code-signing - internal dev tool
  - CKV_AWS_117  # Lambda VPC - needs internet for EC2 API calls
  - CKV_AWS_115  # Lambda concurrency limit - low traffic internal tool
  - CKV_AWS_237  # API GW create before destroy - handled by lifecycle block
  - CKV_AWS_59   # API GW open access - auth via X-API-Key header (custom, not IAM)
  - CKV_AWS_120  # API GW caching - low traffic internal tool
  - CKV_AWS_73   # API GW X-Ray - internal dev tool
  - CKV_AWS_76   # API GW access logging - internal dev tool
  - CKV_AWS_189  # EBS CMK encryption - dev instances, AWS-managed encryption sufficient
  - CKV_AWS_135  # EC2 EBS optimized - g4dn is EBS optimized by default
  - CKV_AWS_126  # EC2 detailed monitoring - dev instance, basic monitoring sufficient
  - CKV_AWS_79   # EC2 IMDSv2 - DCV AMI requires IMDSv1 for licensing
  - CKV_AWS_88   # EC2 public IP - dev desktops need public IP for DCV access
